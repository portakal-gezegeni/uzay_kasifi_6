const $=s=>document.querySelector(s),cv=$("#c"),cx=cv.getContext("2d"),W=480,H=760;cv.width=W;cv.height=H;
const SK=["🚀","🛸","🪐","👽"],SKP=[0,150,400,800],LX=[90,240,390],LC=["#2563eb","#ea580c","#9333ea"];
let S={};try{S=JSON.parse(localStorage.getItem("uzay6"))||{}}catch(e){}
S.best=S.best||0;S.total=S.total||0;S.skin=S.skin||0;
const save=()=>{try{localStorage.setItem("uzay6",JSON.stringify(S))}catch(e){}};
let g=null,parts=[],keys={},tx=W/2,ty=H-80,mode="menu",ac;
const stars=[...Array(70)].map(()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5}));
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const beep=(f,d,t)=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),v=ac.createGain();o.type=t||"sine";o.frequency.value=f;v.gain.value=.07;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
const ov=h=>{$("#ov").innerHTML=h;$("#ov").style.display=h?"flex":"none"};
const fit=()=>{$("#app").style.fontSize=$("#app").clientWidth/480*16+"px"};addEventListener("resize",fit);fit();

function menu(){mode="menu";g=null;ov(`<div class="card"><h1>🚀 Uzay Kaşifi</h1><p><b>6. Sınıf Fen Bilimleri</b></p><p>Parmağını (ya da fareni) sürükleyerek roketi her yöne hareket ettir; <b>doğru cevaba çarptır</b>. Hızlı cevap vermek için yukarı çıkıp cevaba kendin gidebilirsin. Ok tuşlarıyla da oynayabilirsin.</p><p>🪐 🌑 ➡️ ⚖️ 🧭 📈<br><small>50 doğru cevap ver, Uzay Kaşifi ol!<br>3 canın var, her 10 doğruda +1 can (en fazla 3).</small></p><button class="b" id="go">▶ Oyna</button><div class="sk">${SK.map((e,i)=>`<button data-i="${i}" class="${S.skin===i?"on":""}" ${S.total<SKP[i]?"disabled":""}>${S.total<SKP[i]?"🔒<br>"+SKP[i]:e}</button>`).join("")}</div><small>Roket seç · 🔒 toplam puanla açılır<br>En yüksek: ${S.best} · Toplam puan: ${S.total}<br>sürüm 3</small></div>`);
  $("#go").onclick=newGame;document.querySelectorAll(".sk button").forEach(b=>b.onclick=()=>{S.skin=+b.dataset.i;save();menu()})}
function newGame(){g={score:0,hp:3,streak:0,ans:0,wrong:[0,0,0,0,0,0,0],q:sh(Q.map((_,i)=>i)),ok:0,cur:null,b:[],x:W/2,y:H-80,pause:false};tx=W/2;ty=H-80;nextQ();mode="play";ov("");startMusic();beep(520,.1)}
function nextQ(){if(!g.q.length){win();return}g.cur=Q[g.q.pop()];
  const o=sh([[g.cur[2],1],...sh(g.cur[3]).slice(0,2).map(t=>[t,0])]);g.b=o.map((a,i)=>({x:LX[i],y:190,t:a[0],ok:a[1],c:i}))}
const burst=(x,y,c)=>{for(let i=0;i<18;i++)parts.push({x,y,vx:(Math.random()-.5)*320,vy:(Math.random()-.5)*320,l:.6,c})};
function resolve(ok,late){g.tgt=null;
  if(ok){g.streak++;g.ans++;g.ok++;if(g.ok%10===0&&g.hp<3)g.hp++;const m=1+Math.floor(g.streak/3);g.score+=10*m;burst(g.x,g.y-20,"#4ade80");parts.push({x:g.x,y:g.y-50,vx:0,vy:-60,l:.9,t:"+"+10*m,c:"#fde047"});beep(660,.1);setTimeout(()=>beep(880,.14),90);if(g.ok>=50)win();else nextQ()}
  else{g.hp--;g.streak=0;g.wrong[g.cur[0]]++;g.pause=true;g.b=[];burst(g.x,g.y-20,"#f87171");beep(150,.35,"sawtooth");
    const t=TN[g.cur[0]];ov(`<div class="card"><span class="chip">${t[0]} ${t[1]}</span><h1>${late?"⏰ Geç kaldın!":"❌ Olmadı!"}</h1><p>${g.cur[1]}</p><p class="big">Doğru cevap: <b>${g.cur[2]}</b></p><p>💡 ${g.cur[4]}</p><p>${"❤️".repeat(Math.max(g.hp,0))||"💔"}</p><button class="b" id="nx">${g.hp>0?"Devam ▶":"Bitir"}</button></div>`);
    $("#nx").onclick=()=>{ov("");if(g.hp<=0)end();else{g.ans++;nextQ();g.pause=false}}}}
function win(){mode="over";g.b=[];const nb=g.score>S.best;if(nb)S.best=g.score;S.total+=g.score;save();beep(523,.15);setTimeout(()=>beep(659,.15),150);setTimeout(()=>beep(784,.35),300);
  const wt=g.wrong.reduce((a,b)=>a+b,0),r=g.ok/(g.ok+wt),st=r>=.9?"⭐⭐⭐":r>=.7?"⭐⭐":"⭐",m=g.wrong.map((n,i)=>[n,i]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,3);
  ov(`<div class="card"><h1>🎉 Tebrikler Uzay Kaşifi!</h1><p class="big"><b>Tüm konuları tamamladın!</b> 🚀</p><p style="font-size:1.8em;margin:.2em">${st}</p><p>Doğru: <b>${g.ok}</b> · Yanlış: <b>${wt}</b> · Puan: <b>${g.score}</b> ${nb?"🏆 Yeni rekor!":""}</p><div class="miss">${m.length?"<b>Biraz daha çalışırsan tam puan:</b><br>"+m.map(x=>`${TN[x[1]][0]} ${TN[x[1]][1]} (${x[0]} yanlış)`).join("<br>"):"🌟 Hiç yanlışın yok, mükemmel!"}</div><button class="b" id="again">Tekrar oyna</button><button class="b" id="mn" style="background:#334155;color:#fff">Menü</button></div>`);
  $("#again").onclick=newGame;$("#mn").onclick=menu}
function end(){mode="over";const nb=g.score>S.best;if(nb)S.best=g.score;S.total+=g.score;save();
  const m=g.wrong.map((n,i)=>[n,i]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,3);
  ov(`<div class="card"><h1>🌌 Oyun bitti</h1><p class="big">Puan: <b>${g.score}</b> ${nb?"🏆 Yeni rekor!":""}</p><p><small>En yüksek: ${S.best} · Doğru: ${g.ans}</small></p><div class="miss">${m.length?"<b>Biraz daha çalış:</b><br>"+m.map(x=>`${TN[x[1]][0]} ${TN[x[1]][1]} (${x[0]} yanlış)`).join("<br>"):"🎉 Hiç yanlışın yok!"}</div><button class="b" id="again">Tekrar oyna</button><button class="b" id="mn" style="background:#334155;color:#fff">Menü</button></div>`);
  $("#again").onclick=newGame;$("#mn").onclick=menu}

const setT=e=>{const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W;ty=(e.clientY-r.top)/r.height*H-(e.pointerType==="touch"?70:0)};
cv.addEventListener("pointermove",setT);
cv.addEventListener("pointerdown",e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}setT(e)});
const tT=e=>{const t=e.touches[0];if(!t)return;e.preventDefault();const r=cv.getBoundingClientRect();tx=(t.clientX-r.left)/r.width*W;ty=(t.clientY-r.top)/r.height*H-70};
["touchstart","touchmove"].forEach(n=>cv.addEventListener(n,tT,{passive:false}));
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);

function wrap(t,x,y,mw,lh){const w=t.split(" ");let l="",ls=[];w.forEach(s=>{const n=l?l+" "+s:s;if(cx.measureText(n).width>mw&&l){ls.push(l);l=s}else l=n});ls.push(l);const y0=y-(ls.length-1)*lh/2;ls.forEach((s,i)=>cx.fillText(s,x,y0+i*lh))}
function update(dt){
  stars.forEach(s=>{s.y+=s.s*(mode==="play"&&!g.pause?60:20)*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}});
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
  if(mode!=="play"||g.pause)return;
  if(keys.arrowleft||keys.a)tx-=420*dt;if(keys.arrowright||keys.d)tx+=420*dt;tx=Math.max(40,Math.min(W-40,tx));
  if(keys.arrowup||keys.w)ty-=420*dt;if(keys.arrowdown||keys.s)ty+=420*dt;ty=Math.max(200,Math.min(H-60,ty));
  g.x+=(tx-g.x)*Math.min(1,dt*14);g.y+=(ty-g.y)*Math.min(1,dt*14);
  if(Math.random()<.6)parts.push({x:g.x+(Math.random()-.5)*10,y:g.y+25,vx:(Math.random()-.5)*30,vy:130,l:.3,c:"#fb923c"});
  const sp=Math.min(34+g.ans*.5,50);
  for(const b of g.b){b.y+=sp*dt;if(Math.abs(b.x-g.x)<74&&Math.abs(b.y-g.y)<61){resolve(b.ok);return}}
  if(g.b[0]&&g.b[0].y>H+45){if(g.b.some(b=>b.ok))resolve(false,true)}}
function draw(){
  const tc=g&&mode!=="menu"?TN[g.cur[0]][2]:"#1e1b4b",gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,tc);gr.addColorStop(1,"#020617");cx.fillStyle=gr;cx.fillRect(0,0,W,H);
  cx.fillStyle="#fff";stars.forEach(s=>{cx.globalAlpha=.4+s.s/4;cx.fillRect(s.x,s.y,s.s,s.s)});cx.globalAlpha=1;
  if(!g)return;
  cx.textAlign="center";cx.textBaseline="middle";
  g.b.forEach(b=>{cx.fillStyle=LC[b.c];cx.strokeStyle="#fff";cx.lineWidth=2.5;cx.beginPath();cx.roundRect(b.x-70,b.y-37,140,74,20);cx.fill();cx.stroke();cx.fillStyle="#fff";cx.font="bold 16px system-ui,sans-serif";wrap(b.t,b.x,b.y,122,19)});
  if(mode==="play"){cx.font="46px serif";cx.save();cx.translate(g.x,g.y);if(SK[S.skin]==="🚀")cx.rotate(-Math.PI/4);cx.fillText(SK[S.skin],0,0);cx.restore()}
  parts.forEach(p=>{cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;if(p.t){cx.font="bold 26px system-ui,sans-serif";cx.fillText(p.t,p.x,p.y)}else{cx.beginPath();cx.arc(p.x,p.y,4,0,7);cx.fill()}});cx.globalAlpha=1;
  cx.fillStyle="rgba(2,6,23,.75)";cx.strokeStyle="#22d3ee";cx.lineWidth=2;cx.beginPath();cx.roundRect(10,8,W-20,92,16);cx.fill();cx.stroke();
  const t=TN[g.cur[0]];cx.fillStyle="#7dd3fc";cx.font="13px system-ui,sans-serif";cx.fillText(t[0]+" "+t[1]+"  ·  Doğru "+g.ok+"/50",W/2,24);
  cx.fillStyle="#fff";cx.font="bold 20px system-ui,sans-serif";wrap(g.cur[1],W/2,63,430,25);
  cx.font="bold 17px system-ui,sans-serif";cx.textAlign="left";cx.fillText("⭐ "+g.score,16,124);cx.textAlign="center";cx.fillText(g.streak>=3?"🔥 x"+(1+Math.floor(g.streak/3))+" seri "+g.streak:"Seri: "+g.streak,W/2,124);cx.textAlign="right";cx.fillText("❤️".repeat(Math.max(g.hp,0)),W-16,124)}
/* ===== MÜZİK: kodla üretilen, org benzeri pad + arpej ===== */
const CH=[[110,164.81,220,261.63,329.63],[87.31,130.81,174.61,220,261.63],[130.81,196,261.63,329.63,392],[98,146.83,196,246.94,293.66]];
let mOn=false,mg,pm,nextC=0,nextA=0,ci=0,ai=0,cl=[];
function pad(f5,t){const c=ac;f5.forEach(f=>[-6,6].forEach(dt=>{const o=c.createOscillator(),fl=c.createBiquadFilter(),v=c.createGain();o.type="sawtooth";o.frequency.value=f;o.detune.value=dt;fl.type="lowpass";fl.frequency.value=600;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.016,t+1);v.gain.setValueAtTime(.016,t+4);v.gain.linearRampToValueAtTime(0,t+6.5);o.connect(fl);fl.connect(v);v.connect(mg);o.start(t);o.stop(t+6.6)}))}
function tone(f,t){const c=ac,o=c.createOscillator(),v=c.createGain();o.type="sine";o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.05,t+.02);v.gain.exponentialRampToValueAtTime(.001,t+1.5);o.connect(v);v.connect(mg);o.start(t);o.stop(t+1.6)}
function bass(f,t){const c=ac,o=c.createOscillator(),fl=c.createBiquadFilter(),v=c.createGain();o.type="sawtooth";o.frequency.value=f;fl.type="lowpass";fl.frequency.value=380;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.1,t+.01);v.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(fl);fl.connect(v);v.connect(mg);o.start(t);o.stop(t+.45)}
function kick(t){const c=ac,o=c.createOscillator(),v=c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);v.gain.setValueAtTime(.3,t);v.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(v);v.connect(pm);o.start(t);o.stop(t+.25)}
let NB;function hat(t){const c=ac;if(!NB){NB=c.createBuffer(1,c.sampleRate*.1,c.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}const s=c.createBufferSource(),hp=c.createBiquadFilter(),v=c.createGain();s.buffer=NB;hp.type="highpass";hp.frequency.value=7000;v.gain.setValueAtTime(.05,t);v.gain.exponentialRampToValueAtTime(.001,t+.06);s.connect(hp);hp.connect(v);v.connect(pm);s.start(t)}
function sched(){const c=ac,t=c.currentTime;if(nextC<t-1)nextC=t+.1;if(nextA<t-1)nextA=t+.1;
  while(nextC<t+1){cl.push({t:nextC,k:ci%4});if(cl.length>4)cl.shift();pad(CH[ci%4],nextC);ci++;nextC+=4}
  while(nextA<t+1){let k=0;cl.forEach(x=>{if(x.t<=nextA)k=x.k});if(ai%2===0){bass(CH[k][0],nextA);kick(nextA)}else hat(nextA);tone(CH[k][[2,3,4,3,2,3,4,3][ai%8]]*2,nextA);ai++;nextA+=.25}}
function startMusic(){if(mOn)return;try{ac=ac||new AudioContext();if(ac.state==="suspended")ac.resume();const c=ac,rv=c.createConvolver(),wet=c.createGain(),n=c.sampleRate*3,b=c.createBuffer(2,n,c.sampleRate);
  for(let k=0;k<2;k++){const d=b.getChannelData(k);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}
  rv.buffer=b;wet.gain.value=.7;mg=c.createGain();mg.gain.value=S.mute?0:.9;mg.connect(c.destination);mg.connect(rv);pm=c.createGain();pm.gain.value=S.mute?0:.9;pm.connect(c.destination);const dl=c.createDelay(),fb=c.createGain();dl.delayTime.value=.375;fb.gain.value=.3;mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(c.destination);rv.connect(wet);wet.connect(c.destination);
  nextC=c.currentTime+.1;nextA=nextC+3;mOn=true;sched();setInterval(sched,200)}catch(e){}}
$("#mu").textContent=S.mute?"🔇":"🔊";
$("#mu").onclick=()=>{S.mute=!S.mute;save();$("#mu").textContent=S.mute?"🔇":"🔊";startMusic();if(mg){mg.gain.setTargetAtTime(S.mute?0:.9,ac.currentTime,.1);pm.gain.setTargetAtTime(S.mute?0:.9,ac.currentTime,.1)}};
let last=performance.now();
function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;update(dt);draw();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script>
